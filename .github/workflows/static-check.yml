name: static-check

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static checks
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-verify.ps1 -SkipBuild
